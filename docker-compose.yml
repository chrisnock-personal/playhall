# Playhall: the app and its database. Copy .env.example to .env and fill it in.
#   podman-compose up -d --build
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: playhall
      POSTGRES_USER: playhall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - playhall-db:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/playhall:latest
    environment:
      DATABASE_URL: postgres://playhall:${POSTGRES_PASSWORD}@postgres:5432/playhall
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      # HTTPS with a self-signed certificate made on first start (kept in the
      # playhall-certs volume). TLS_HOSTS: extra names/addresses it should cover.
      TLS: ${TLS:-on}
      TLS_HOSTS: ${TLS_HOSTS:-}
      # Voice and video (phase 2): set these and start with --profile media.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Transcripts: an existing whisper.cpp server (empty = none); TRANSCRIPTS=off disables them.
      WHISPER_URL: ${WHISPER_URL:-}
      TRANSCRIPTS: ${TRANSCRIPTS:-}
    volumes:
      - playhall-certs:/app/certs
    ports:
      - "${PLAYHALL_PORT:-8450}:8450"
    depends_on:
      - postgres
    restart: unless-stopped

  # Voice and video: a self-hosted LiveKit server (Apache-2.0). Optional:
  #   podman-compose --profile media up -d
  # Its signalling goes through Playhall's own HTTPS port (/rtc); the audio and
  # video use one UDP port, with a TCP port for networks that block UDP. Open
  # both in the firewall. LIVEKIT_NODE_IP is the address browsers reach this
  # machine on (its LAN or public IP).
  livekit:
    image: docker.io/livekit/livekit-server:v1.13.11
    profiles: [media]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        keys:
          ${LIVEKIT_API_KEY:-unset}: ${LIVEKIT_API_SECRET:-unset}
        room:
          empty_timeout: 300
        logging:
          level: info
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    restart: unless-stopped

volumes:
  playhall-db:
  playhall-certs:
