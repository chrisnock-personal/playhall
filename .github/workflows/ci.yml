name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the end-to-end and browser tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: playhall
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: playhall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U playhall" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://playhall:ci-only@localhost:5432/playhall
      JWT_SECRET: ci-only-not-a-secret-0123456789abcdef0123456789
      # Plain HTTP here; the container job below checks the default HTTPS.
      TLS: 'off'
      # The smoke test tests the platform settings with this account. ADMIN_USERNAMES only
      # names accounts that exist when the server starts (#63), so it's made before a restart.
      ADMIN_USERNAMES: smoke_admin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (game rules, room engine)
        run: npm test
      - name: Build
        run: npm run build
      - name: Start the server (registering the smoke admin first, then restarting)
        run: |
          node dist/server/index.js > server.log 2>&1 & echo $! > server.pid
          for _ in $(seq 1 30); do curl -sf http://localhost:8450/api/health && break; sleep 1; done
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"username":"smoke_admin","password":"smoke-admin-pw","displayName":"Smoke Admin"}' http://localhost:8450/api/auth/register > /dev/null
          kill "$(cat server.pid)"; sleep 2
          node dist/server/index.js >> server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8450/api/health && break; sleep 1; done
      - name: End-to-end (accounts, rooms, a game over the WebSocket, results, platform settings)
        run: node scripts/smoke.mjs http://localhost:8450
      - name: Demo data loads and removes cleanly
        run: |
          node dist/server/demo.js
          psql "$DATABASE_URL" -tAc "SELECT count(*) FROM game_results" | grep -qv '^0$'
          node dist/server/demo.js --remove
          test "$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM users WHERE is_demo')" = 0
      - name: Browsers for the browser test (Chromium, Firefox, WebKit)
        id: browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser test, Chromium
        run: node tests/browser.mjs http://localhost:8450 chromium
      # Firefox and WebKit (Safari's engine) run even if an engine before them failed.
      - name: Browser test, Firefox
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser.mjs http://localhost:8450 firefox
      - name: Browser test, WebKit
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser.mjs http://localhost:8450 webkit
      - name: Server log, if it failed
        if: failure()
        run: tail -50 server.log
      - name: Known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Secrets in the history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The real packaging: build the image, start it with compose, check it.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start Playhall with compose
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-compose\nJWT_SECRET=ci-only-not-a-secret-0123456789abcdef0123456789\n' > .env
          # Voice and video too: the LiveKit container, on this machine's address.
          printf 'LIVEKIT_URL=http://livekit:7880\nLIVEKIT_API_KEY=playhall\nLIVEKIT_API_SECRET=ci-only-livekit-secret-0123456789abcdef\nLIVEKIT_NODE_IP=127.0.0.1\n' >> .env
          docker compose build -q
          docker compose --profile media up -d
          for _ in $(seq 1 60); do curl -skf https://localhost:8450/api/health && break; sleep 2; done
      - name: Demo data inside the container
        run: docker compose exec -T app node dist/server/demo.js
      - name: End-to-end against the container (HTTPS, self-signed)
        run: node scripts/smoke.mjs https://localhost:8450
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
      - name: Voice, both ways, in two browsers with fake microphones
        run: |
          npx playwright install --with-deps chromium
          node tests/voice.mjs https://localhost:8450
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
      - name: The certificate survives recreating the container
        run: |
          before=$(docker compose exec -T app cat /app/certs/server.crt | sha256sum)
          docker compose --profile media up -d --force-recreate app
          for _ in $(seq 1 60); do curl -skf https://localhost:8450/api/health && break; sleep 2; done
          after=$(docker compose exec -T app cat /app/certs/server.crt | sha256sum)
          test "$before" = "$after"
          curl -sk -o /dev/null -w '%{http_code}\n' https://localhost:8450/ | grep -q 200
      - name: Logs, if it failed
        if: failure()
        run: docker compose logs --tail 50
